<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Зал">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#0e1014">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Зал</title>
<style>
:root{--bg:#0b0d11;--card:#161920;--card2:#222733;--line:#262c39;--text:#f3f5f9;--muted:#8d95a8;--accent:#c8f53a;--accent-soft:rgba(200,245,58,.12);--on-accent:#12150a;--ar:200,245,58;--a1:#d4fa56;--a2:#bdee26;--danger:#ff6b6b;--amber:#ffb02e;--r:20px;--shadow:0 1px 0 rgba(255,255,255,.04) inset,0 8px 24px rgba(0,0,0,.28)}
/* две стороны приложения: Спорт (лайм) и Питание (мята). Призраки при переходе держат цвет своей стороны */
html.wf,.wf{--accent:#2ee6b6;--accent-soft:rgba(46,230,182,.12);--on-accent:#04150f;--ar:46,230,182;--a1:#5cf0cf;--a2:#22d6a5}
.ws{--accent:#c8f53a;--accent-soft:rgba(200,245,58,.12);--on-accent:#12150a;--ar:200,245,58;--a1:#d4fa56;--a2:#bdee26}
.tabsg{z-index:11;pointer-events:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:radial-gradient(120% 60% at 50% -10%,rgba(var(--ar),.07),transparent 60%) no-repeat,var(--bg);color-scheme:dark}
/* min-height: страница всегда чуть выше экрана (--full задаёт скрипт для iPhone-приложения),
   иначе iOS укорачивает область снизу на коротких экранах и под меню остаётся пробел */
body{margin:0;min-height:var(--full,calc(100vh + 2px));overflow-x:hidden;touch-action:pan-y;color:var(--text);font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
#app{max-width:520px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px calc(104px + env(safe-area-inset-bottom))}
/* «призрак» уходящего экрана при переходе назад */
.ghost{position:fixed;inset:0;z-index:8;overflow:hidden;pointer-events:none;will-change:transform;background:radial-gradient(120% 60% at 50% -10%,rgba(var(--ar),.07),transparent 60%) no-repeat,var(--bg);box-shadow:-14px 0 32px rgba(0,0,0,.55)}
.ghost .gin{max-width:520px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px calc(104px + env(safe-area-inset-bottom))}
.modal.dlg{align-items:flex-start;padding-top:calc(env(safe-area-inset-top) + 9vh);z-index:40}   /* окно ввода: у верха, чтобы клавиатура не закрывала */
.dlg .mcard{max-width:420px}
.dlg .btn.cta{margin-top:0}
.dlg .row2{margin-top:14px}
.dlg .text{margin-bottom:0}
.modal.dlg.center{align-items:center;padding-top:20px}   /* подтверждения — по центру */
.dlg .stack{display:grid;gap:10px;margin-top:18px}
.btn.dng{background:linear-gradient(180deg,#ff8585,#ff5a5a);color:#2a0606;box-shadow:0 1px 0 rgba(255,255,255,.3) inset,0 6px 18px rgba(255,90,90,.2)}
.ghost.flat{box-shadow:none}   /* смена вкладки: экраны рядом, без тени */
.swapwrap{position:relative;overflow:hidden;margin:0 -16px -24px;padding:0 16px 24px}   /* зона слайда внутри экрана (переключатель разделов, месяцы) */
.swapout{position:absolute;left:16px;right:16px;top:0;pointer-events:none}
#calwrap .card.cal{margin-bottom:0}
.ghost.under{z-index:-1;box-shadow:none;background:none}   /* уходящий экран под новым при переходе вперёд */
#app.pushing{position:relative;min-height:var(--full,100vh);background:radial-gradient(120% 60% at 50% -10%,rgba(var(--ar),.07),transparent 60%) no-repeat,var(--bg);box-shadow:-14px 0 32px rgba(0,0,0,.55)}   /* выезжающий экран */
h1{font-size:32px;font-weight:800;margin:6px 0 16px;letter-spacing:-.8px}
.ic{width:1.25em;height:1.25em;flex:none;display:inline-block;vertical-align:-.22em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.ic.lg{width:28px;height:28px}
.ic.xl{width:34px;height:34px}
.btn .ic{margin-right:8px}
.btn .ic.r{margin:0 0 0 8px}
.btn.sm .ic,.btn.mv .ic,.stepper .btn .ic,.back .ic,.spk .ic,.sbtn .ic{margin-right:0}
.stepper .btn .ic{width:34px;height:34px;stroke-width:2.4}
.ttl{display:flex;align-items:center;gap:10px}
.ttl .ic{width:22px;height:22px;color:var(--accent)}
.chev{margin-left:auto;color:var(--muted)}
.empty{text-align:center;padding:30px 12px;color:var(--muted)}
.empty .ic{width:44px;height:44px;color:var(--accent);opacity:.9;margin-bottom:10px}
h2{font-size:22px;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button,input{font:inherit;color:inherit}
button{touch-action:manipulation;cursor:pointer;-webkit-user-select:none;user-select:none}
.hide{display:none!important}

.card{background:var(--card);border-radius:var(--r);padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.card.active{box-shadow:inset 0 0 0 2px var(--accent),0 0 32px rgba(var(--ar),.12)}
.title{font-size:21px;font-weight:700}
.small{color:var(--muted);font-size:15px;margin:2px 0 12px}
.small.nm{margin-bottom:0}

.btn{display:flex;align-items:center;justify-content:center;width:100%;border:0;border-radius:16px;min-height:52px;padding:0 16px;background:var(--card2);font-size:17px;font-weight:600;box-shadow:0 1px 0 rgba(255,255,255,.05) inset;transition:transform .08s,filter .12s}
.btn:active{filter:brightness(1.3);transform:scale(.98)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:linear-gradient(180deg,var(--a1),var(--a2));color:var(--on-accent);box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 6px 18px rgba(var(--ar),.18)}
.btn.danger{color:var(--danger)}
.btn.big{min-height:76px;font-size:22px;margin-top:16px}
.btn.cta{min-height:50px;font-size:17px;margin-top:12px;border-radius:14px}
.btn.sm{min-height:48px;width:auto;padding:0 16px}
.logrow{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:10px;margin-top:16px}
.logrow .btn.big{margin-top:0}
.logrow .btn.primary{font-size:clamp(16px,4.4vw,18px);padding:0 6px;line-height:1.15}
.btn.fin{background:var(--amber);color:#1a1200;font-size:clamp(13px,3.8vw,15px);line-height:1.15;padding:0 4px;overflow-wrap:anywhere}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}

/* tabs */
:is(#tabs,.tabsg){position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(17,20,26,.92);-webkit-backdrop-filter:blur(20px) saturate(1.4);backdrop-filter:blur(20px) saturate(1.4);padding:6px 10px calc(6px + env(safe-area-inset-bottom));border-top:1px solid var(--line);z-index:10}
:is(#tabs,.tabsg) button{flex:1;background:none;border:0;min-height:56px;font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;transition:color .15s}
:is(#tabs,.tabsg) button .ic{width:26px;height:26px;padding:3px 14px;box-sizing:content-box;border-radius:999px;transition:background .15s,color .15s}
:is(#tabs,.tabsg) button.on{color:var(--accent)}
:is(#tabs,.tabsg) button.on .ic{background:var(--accent-soft)}

/* headers */
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.top h1{flex:1;margin:6px 0}
.back{background:var(--card2);border:0;border-radius:14px;min-height:48px;min-width:48px;display:grid;place-items:center;padding:0;box-shadow:0 1px 0 rgba(255,255,255,.05) inset}
.back .ic{width:26px;height:26px}
.back:active{transform:scale(.94)}
.datebtn{position:relative;display:inline-flex;align-items:center;background:var(--card2);border-radius:14px;min-height:48px;padding:0 14px;font-weight:600;white-space:nowrap}
.datebtn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px}

/* programs */
.pcard{display:block;width:100%;text-align:left;border:0;background:var(--card);border-radius:var(--r);padding:18px;margin-bottom:12px;box-shadow:var(--shadow);transition:transform .08s}
.pcard:active{transform:scale(.985)}
.pcard.cur{background:linear-gradient(160deg,#1b2612,#141a10 60%);box-shadow:inset 0 0 0 2px var(--accent),0 0 32px rgba(var(--ar),.1)}
.pcard.rep:not(.cur){box-shadow:inset 4px 0 0 var(--amber),var(--shadow)}
.phead{display:flex;align-items:center;gap:8px}
.phead>div{flex:1;min-width:0}
.pname{font-size:22px;font-weight:800;letter-spacing:-.3px}
.pdates{color:var(--muted);font-size:16px;font-weight:500;white-space:nowrap}
.chips2{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.chip2{font-size:13px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--card2);color:var(--muted)}
.chip2.cur{background:var(--accent);color:var(--on-accent)}
.chip2.rep{background:#3a2c0f;color:var(--amber)}
.wrows{margin-top:10px}
.wrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.wn{flex:0 0 42%;max-width:42%;font-size:17px;font-weight:600;word-break:break-word}
.dots{flex:1;display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.dots i{display:block;width:11px;height:11px;border-radius:50%;background:var(--c,var(--accent));box-shadow:0 0 8px rgba(var(--cr,200,245,58),.45)}
.tdot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--c,var(--accent));box-shadow:0 0 8px rgba(var(--cr,200,245,58),.5);margin-right:9px;vertical-align:1px}
/* карточка тренировки в редакторе: слева небольшая цветная точка (зона нажатия большая), справа стрелка */
.wrowe{display:flex;align-items:stretch;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden}
.cdot{flex:none;width:58px;border:0;background:none;display:grid;place-items:center;padding:0}
.cdot i{display:block;width:20px;height:20px;border-radius:50%;background:var(--c);box-shadow:0 0 0 4px rgba(var(--cr),.16),0 0 12px rgba(var(--cr),.3);transition:transform .12s}
.cdot:active i{transform:scale(.8)}
.witem{flex:1;min-width:0;display:flex;align-items:center;gap:8px;text-align:left;border:0;background:none;padding:16px 16px 16px 0}
.witem .wtx{flex:1;min-width:0;display:block}
.witem .title,.witem .small{display:block}
.witem .small{margin:2px 0 0}
.swgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 0;margin-top:20px;justify-items:center}
.swc{width:54px;height:54px;border-radius:50%;border:0;padding:0;background:var(--c);color:#12150a;display:grid;place-items:center;box-shadow:0 0 0 4px rgba(var(--cr),.14),0 0 14px rgba(var(--cr),.25);transition:transform .1s}
.swc:active{transform:scale(.9)}
.swc .ic{width:22px;height:22px;stroke-width:3}
.swc.on{box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--c),0 0 16px rgba(var(--cr),.4)}
.callg{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:14px;color:var(--muted)}
.lgi{display:inline-flex;align-items:center;gap:6px}
.lgi i{display:block;width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 6px rgba(var(--cr),.5)}
.nodots{color:#4a5163}
.drow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px}
.gh{color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;margin:22px 4px 10px}

/* session */
.restbar{position:sticky;top:calc(6px + env(safe-area-inset-top));z-index:5;background:linear-gradient(180deg,var(--a1),var(--a2));color:var(--on-accent);border-radius:18px;padding:8px;margin-bottom:12px;font-weight:700;box-shadow:0 10px 28px rgba(0,0,0,.5),0 0 24px rgba(var(--ar),.2)}
.restbar.done{background:linear-gradient(180deg,#ffc04d,#ffa414);box-shadow:0 10px 28px rgba(0,0,0,.5),0 0 24px rgba(255,176,46,.25)}
.rrow{display:flex;align-items:center;gap:8px;padding-left:8px}
.rrow span{flex:1;font-size:22px;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.restbar .btn{background:rgba(0,0,0,.16);color:inherit;min-height:44px;padding:0 12px;font-size:16px}
.restbar .sbtn{margin-top:8px;font-size:17px}
.rrow.hide+.sbtn{margin-top:0}
.restbar.bigbtn .sbtn{min-height:76px;font-size:22px;background:#12150a;color:var(--accent)}

/* итоги, переключатель */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);z-index:30;display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .2s ease-out}
.mcard{background:var(--card);border-radius:26px;padding:22px;width:100%;max-width:440px;max-height:calc(100vh - 40px);overflow:auto;box-shadow:inset 0 0 0 2px var(--accent),0 20px 60px rgba(0,0,0,.6);animation:pop .22s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.modal,.mcard{animation:none}*{transition:none!important}}
.stat{padding:12px 0;border-top:1px solid var(--line)}
.sl{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.06em}
.sv{font-size:17px;margin-top:3px}
.sv.big{font-size:38px;font-weight:800;color:var(--accent);letter-spacing:-.5px}
.sv.sm0{color:var(--muted)}
.sn{color:var(--muted);font-size:14px;margin-top:2px}
.trow{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card2);border:0;border-radius:16px;padding:14px 16px;margin-top:14px;min-height:64px}
.trow>span:first-child{flex:1}
.tl{display:block;font-size:18px;font-weight:600}
.td{display:block;color:var(--muted);font-size:14px;margin-top:2px;font-weight:400}
.sw{position:relative;flex:none;width:62px;height:36px;border-radius:999px;background:#3a4152;transition:background .15s}
.sw i{position:absolute;top:4px;left:4px;width:28px;height:28px;border-radius:50%;background:#aab1c2;box-shadow:0 2px 6px rgba(0,0,0,.35);transition:left .15s}
.sw.on{background:var(--accent)}
.sw.on i{left:30px;background:var(--on-accent)}

.ex{scroll-margin-top:90px}
.ex.open{box-shadow:inset 0 0 0 2px var(--accent),0 0 28px rgba(var(--ar),.1)}
.exhead{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;padding:0}
.exhead .col{flex:1;min-width:0}
.exname{display:block;font-size:20px;font-weight:700}
.exsum{display:block;color:var(--muted);font-size:15px;margin-top:2px}
.badge{background:var(--card2);border-radius:999px;min-width:38px;height:38px;display:grid;place-items:center;font-weight:800;color:var(--muted)}
.badge.on{background:var(--accent);color:var(--on-accent);box-shadow:0 0 14px rgba(var(--ar),.35)}
.prev{background:var(--card2);border-radius:12px;padding:10px 12px;margin:14px 0 4px;font-size:16px;color:var(--muted)}
.prev b{color:var(--text)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{border:0;background:var(--card2);border-radius:12px;padding:12px 14px;font-size:17px;font-weight:600;min-height:48px}
.chip.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.newex .chips{flex-wrap:nowrap;gap:6px;margin:6px 0 10px}
.newex .chip{flex:1;min-width:0;padding:10px 2px;font-size:15px;white-space:nowrap}
.lbl{color:var(--muted);font-size:13px;margin:14px 0 6px;text-transform:uppercase;letter-spacing:.07em}
.stepper{display:grid;grid-template-columns:84px 1fr 84px;gap:10px}
.stepper .btn{min-height:76px;font-size:38px;padding:0;line-height:1}
.stepper input{width:100%;min-width:0;height:76px;border:0;border-radius:16px;background:var(--bg);text-align:center;font-size:42px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.5px;outline:none;box-shadow:inset 0 0 0 1px var(--line)}
.stepper input:focus{box-shadow:inset 0 0 0 2px var(--accent)}
.note,.text{width:100%;border:0;border-radius:12px;background:var(--card2);padding:0 14px;outline:none}
.note{height:48px;margin-top:14px;font-size:16px}
.text{height:52px;font-size:18px;margin-bottom:10px}
.note:focus,.text:focus{box-shadow:inset 0 0 0 2px var(--accent)}

/* lists */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border-radius:14px;padding:4px;margin-bottom:14px}
.seg button{border:0;background:none;min-height:46px;border-radius:11px;font-weight:600;color:var(--muted)}
.seg .on{background:var(--card2);color:var(--text);box-shadow:0 1px 0 rgba(255,255,255,.07) inset,0 2px 8px rgba(0,0,0,.3)}
.item{display:block;width:100%;text-align:left;border:0;background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:10px;box-shadow:var(--shadow);transition:transform .08s}
.item:active{transform:scale(.985)}
.item .small{margin:2px 0 0}
.chart{width:100%;height:auto;display:block;margin-top:8px}
.hrow{padding:12px 0;border-top:1px solid var(--line)}
.hrow:first-child{border-top:0}
.hrow .d{color:var(--muted);font-size:14px}
.hrow .v{font-size:19px;font-weight:700}
.hrow .n{color:var(--muted);font-size:15px}
.exedit .rowx{display:flex;align-items:center;gap:8px}
.exedit .rowx label{flex:1;color:var(--muted);font-size:14px;display:flex;align-items:center;gap:8px}
.exedit .rowx input{width:68px;flex:none;height:48px;border:0;border-radius:12px;background:var(--card2);text-align:center;font-size:18px;outline:none}
.exedit .btn.sm{min-width:48px;padding:0}
.exedit .seg{background:var(--bg);margin:0 0 10px}
.exedit .seg .on{background:var(--card2);color:var(--accent)}
.exedit .rowx{gap:6px}
.exedit .rowx .btn.mv{flex:0 0 44px;width:44px;min-width:44px;min-height:48px;padding:0;font-size:22px}
.btn:disabled{opacity:.3;pointer-events:none}
.stepper.t{grid-template-columns:64px minmax(0,1fr) 64px}
.stepper.t .btn{font-size:34px}
.tin{display:flex;align-items:center;gap:4px;min-width:0;height:76px;border-radius:16px;background:var(--card2);padding:0 6px}
.tin label{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center}
.tin input{width:100%;min-width:0;height:46px;border:0;background:transparent;text-align:center;font-size:clamp(28px,8.5vw,36px);font-weight:700;outline:none;border-radius:10px;padding:0}
.tin input:focus{box-shadow:inset 0 0 0 2px var(--accent)}
.tin small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;line-height:1;margin-top:-2px}
.tin b{font-size:30px;color:var(--muted);padding-bottom:12px}
.swbox{display:flex;align-items:center;gap:10px;background:var(--card2);border-radius:16px;padding:8px 8px 8px 16px;margin-top:14px}
.swt{flex:1;font-size:44px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent);letter-spacing:-.5px}
.swbox .btn{width:auto;min-width:124px;min-height:64px;background:var(--amber);color:#1a1200}
.btn.swgo{margin-top:14px;min-height:64px;background:var(--card2);color:var(--accent)}
.card .seg{background:var(--bg);margin:0 0 4px}
.card .seg .on{background:var(--card2);color:var(--accent)}
.seg.s3{grid-template-columns:1fr 1fr 1fr}
.wcard{padding:14px 0;border-top:1px solid var(--line)}
.wcard:first-of-type{border-top:0}
.wen{font-size:30px;font-weight:800;letter-spacing:-.3px;display:flex;align-items:center;gap:6px}
.wen span{flex:1;min-width:0;overflow-wrap:anywhere}
.spk{background:var(--card2);border:0;border-radius:12px;min-width:44px;min-height:44px;display:grid;place-items:center;color:var(--accent);padding:0}

i.pd{display:block;width:6px;height:6px;border-radius:50%;box-shadow:inset 0 0 0 1.5px #4cc9f0;background:transparent}

.wch{margin-top:8px}

.wrw{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:12px 0;color:var(--text)}

.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}

.scan{position:relative;border-radius:var(--r);overflow:hidden;background:#000;aspect-ratio:3/4;max-height:52vh;width:100%}

.scan .sln{position:absolute;left:14%;right:14%;top:50%;height:2px;background:var(--accent);opacity:.8;animation:sl 1.6s ease-in-out infinite alternate}
@keyframes sl{from{top:40%}to{top:60%}}
</style>

<script>
(function(){

/* ---------- helpers ---------- */

var uid=function(){return Math.random().toString(36).slice(2,9)};

  drop:'M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z',
  scale:'M4 4h16v16H4zM8 10a4 4 0 0 1 8 0M12 10l2.5-3',

};
var FILLED={play:1,stop:1,skip:1};
/* цвета тренировок: хранится ключ в w.color, а в сессии s.color (копия на случай, если тренировку удалят) */
var PAL=[
  {k:'lime',n:'Лайм',h:'#c8f53a',r:'200,245,58'},
  {k:'sky',n:'Небо',h:'#4cc9f0',r:'76,201,240'},
  {k:'orange',n:'Оранжевый',h:'#ffa62b',r:'255,166,43'},
  {k:'pink',n:'Розовый',h:'#ff6fb5',r:'255,111,181'},
  {k:'violet',n:'Фиолетовый',h:'#9b7bff',r:'155,123,255'},
  {k:'mint',n:'Мята',h:'#2ee6b6',r:'46,230,182'},
  {k:'red',n:'Красный',h:'#ff6b6b',r:'255,107,107'},
  {k:'yellow',n:'Жёлтый',h:'#ffe14d',r:'255,225,77'}
];
var palBy=function(k){return PAL.find(function(c){return c.k===k})||PAL[0]};
var colStyle=function(c){return 'style="--c:'+c.h+';--cr:'+c.r+'"'};
// цвет, который ещё не занят в программе (по кругу, если все заняты)
function nextColor(p){
  var used={}; p.workouts.forEach(function(w){if(w.color) used[w.color]=1});
  var free=PAL.find(function(c){return !used[c.k]});
  return (free||PAL[p.workouts.length%PAL.length]).k;
}
// старым тренировкам без цвета раздаём разные цвета по порядку
function ensureColors(d){
  (d.programs||[]).forEach(function(p){
    var used={};
    p.workouts.forEach(function(w){if(w.color&&palBy(w.color).k===w.color) used[w.color]=1;});
    p.workouts.forEach(function(w,i){
      if(w.color&&used[w.color]) return;
      var free=PAL.find(function(c){return !used[c.k]});
      w.color=(free||PAL[i%PAL.length]).k; used[w.color]=1;
    });
  });
}
function ic(n,c){return '<svg class="ic'+(c?' '+c:'')+'" viewBox="0 0 24 24" aria-hidden="true"'+(FILLED[n]?' style="fill:currentColor"':'')+'><path d="'+ICONS[n]+'"/></svg>'}
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var num=function(n){return String(Math.round(n*100)/100).replace('.',',')};
var parseNum=function(s){var v=parseFloat(String(s).replace(',','.'));return isNaN(v)?0:v};
var dateOf=function(ts){var d=new Date(ts);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var pad=function(n){return String(n).padStart(2,'0')};
var today=function(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var fmtDate=function(d){
  if(!d) return 'без даты';
  var p=d.split('-'), cy=String(new Date().getFullYear());
  return p[2]+'.'+p[1]+(p[0]!==cy?'.'+p[0].slice(2):'');
};
var mmss=function(s){return Math.floor(s/60)+':'+pad(s%60)};
var norm=function(s){return String(s||'').trim().toLowerCase().replace(/ё/g,'е').replace(/\s+/g,' ')};
var fmtT=function(sec){
  sec=Math.max(0,Math.round(sec)); var m=Math.floor(sec/60), r=sec%60;
  if(!m) return r+' с';
  return r?m+' мин '+r+' с':m+' мин';
};
var setLbl=function(x){return x.s!=null?fmtT(x.s):num(x.w)+'×'+x.r};
function fmtSets(sets){
  var g=[];
  sets.forEach(function(x){
    var l=g[g.length-1];
    if(x.s!=null){ if(l&&l.t) l.r.push(fmtT(x.s)); else g.push({t:1,r:[fmtT(x.s)]}); return; }

  });

}

// в базе должны быть все упражнения из программ и истории (по названию без учёта регистра и пробелов)
function syncLib(d){
  d.lib=Array.isArray(d.lib)?d.lib:[];
  var have=Object.create(null);
  d.lib.forEach(function(l){have[norm(l.name)]=l});
  function add(name,ex,sets){
    var n=norm(name); if(!n||have[n]) return;
    var tp=ex?exType(ex):((sets||[]).some(function(x){return x.s!=null})?'t':'w');
    var l={id:uid(),name:String(name).trim().replace(/\s+/g,' '),type:tp,step:(ex&&ex.step)||2.5,tstep:(ex&&ex.tstep)||30};
    d.lib.push(l); have[n]=l;
  }
  d.programs.forEach(function(p){p.workouts.forEach(function(w){w.exercises.forEach(function(e){add(e.name,e)})})});
  d.sessions.forEach(function(s){Object.keys(s.entries||{}).forEach(function(k){var e=s.entries[k];if(e&&e.sets&&e.sets.length)add(e.name,null,e.sets)})});
}

// настройки (тип, шаг) одинаковы у всех упражнений с таким названием
function applyProps(name,props){
  var n=norm(name), l=libFind(name);
  if(l) Object.keys(props).forEach(function(k){l[k]=props[k]});

// переименование = во всей базе и истории; если такое имя уже есть — объединение. Возвращает итоговую запись базы.
// результат передаётся в done(запись базы или null): при объединении сначала спрашиваем подтверждение в окне приложения
function renameEx(oldName,val,done){
  var nn=String(val||'').trim().replace(/\s+/g,' ');
  if(!nn||nn===oldName){done(null);return;}
  syncLib(S);
  var on=norm(oldName), lib=libFind(oldName);
  var other=S.lib.find(function(l){return l!==lib&&norm(l.name)===norm(nn)});
  if(other){
    askConfirm({title:'Объединить упражнения?',text:'«'+other.name+'» уже есть в базе. Объединить «'+oldName+'» с ним? История по обоим станет общей.',ok:'Объединить',
      cb:function(){
        S.lib=S.lib.filter(function(l){return l!==lib});
        renameEverywhere(on,other.name);
        applyProps(other.name,{type:exType(other),step:other.step||2.5,tstep:other.tstep||30});
        save(); done(other);
      },
      no:function(){done(null);}});
    return;
  }
  if(lib) lib.name=nn;
  renameEverywhere(on,nn);
  save(); done(lib||libFind(nn));
}
function libStats(){
  var m=Object.create(null);
  S.sessions.forEach(function(s){Object.keys(s.entries).forEach(function(k){
    var e=s.entries[k]; if(!e.sets.length) return;
    var n=norm(e.name), x=m[n]||(m[n]={last:0,count:0});
    x.count++; if(s.ts>x.last) x.last=s.ts;
  })});

}

function lev(a,b){
  var d=[],i,j;
  for(i=0;i<=a.length;i++){d[i]=[i];}
  for(j=1;j<=b.length;j++) d[0][j]=j;
  for(i=1;i<=a.length;i++) for(j=1;j<=b.length;j++)
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[a.length][b.length];
}
// похожие названия: «жим лежа» ~ «Жим штанги лёжа», «присед» ~ «приседания», опечатки
function simil(a,b){
  a=norm(a); b=norm(b);
  if(!a||!b) return false;
  if(a===b) return true;
  var ca=a.replace(/[^a-zа-я0-9]/g,''), cb=b.replace(/[^a-zа-я0-9]/g,'');
  if(ca===cb) return true;
  if(ca.length>=3&&cb.length>=3&&(ca.indexOf(cb)>=0||cb.indexOf(ca)>=0)) return true;
  var ta=a.split(' '), tb=b.split(' ');
  var sh=ta.length<=tb.length?ta:tb, lg=ta.length<=tb.length?tb:ta;
  if(sh.length>=2||lg.length>=2){
    var all=sh.every(function(x){return lg.some(function(y){return x===y||(x.length>=4&&y.length>=4&&x.slice(0,4)===y.slice(0,4))})});
    if(all&&sh.length>=1&&(sh.length>=2||sh[0].length>=4)) return true;
  }
  return lev(ca,cb)<=(Math.max(ca.length,cb.length)>=8?2:1);
}

function exInfo(exId){
  for(var i=0;i<S.programs.length;i++){
    var p=S.programs[i];
    for(var j=0;j<p.workouts.length;j++){
      var w=p.workouts[j], e=w.exercises.find(function(x){return x.id===exId});
      if(e) return {ex:e,w:w,p:p};

// «Прошлый раз»: то же упражнение по названию; сначала из тренировки с тем же названием (в любой программе), потом из любой
function prevEntry(exId,ses){
  var info=exInfo(exId); if(!info) return null;
  var nm=norm(info.ex.name), wn=norm(info.w.name);
  var arr=sessionsSorted().filter(function(x){return x.id!==ses.id&&x.ts<ses.ts}).reverse();
  function pass(sameW){
    for(var i=0;i<arr.length;i++){
      var x=arr[i];
      if(sameW&&norm(x.name)!==wn) continue;
      var keys=Object.keys(x.entries);
      for(var j=0;j<keys.length;j++){
        var e=x.entries[keys[j]];
        if(e.sets.length&&norm(e.name)===nm) return {e:e,date:x.date};
      }
    }
    return null;
  }
  return pass(true)||pass(false);
}

var WINT=[0,4,8,16,32,64], wcache={};
function WS(){
  var w=S.words; if(!w||typeof w!=='object') w=S.words={on:true,lvl:'b',n:2,tick:0,p:{}};
  if(w.lvl!=='a'&&w.lvl!=='b') w.lvl='b';
  if(!(w.n>=1&&w.n<=3)) w.n=2;
  w.tick=w.tick||0; w.p=w.p||{}; w.on=w.on!==false;
  return w;
}
function CW(){return Array.isArray(S.cwords)?S.cwords:(S.cwords=[]);}
function wordsOf(lvl){
  if(wcache[lvl]) return wcache[lvl];
  var list=WORDS[lvl].map(function(l){var q=l.split('|');return {key:lvl+':'+q[0],en:q[0],ru:q[1],ex:q[2]}});
  var idx={}; list.forEach(function(x){idx[x.key]=x});
  return wcache[lvl]={list:list,idx:idx};
}
function wordByKey(k){
  if(k.charAt(0)==='c'){
    var c=CW().find(function(x){return 'c:'+x.id===k});
    return c?{key:k,en:c.en,ru:c.ru,ex:c.ex||'',custom:true}:null;
  }
  var lv=k.charAt(0); return WORDS[lv]?wordsOf(lv).idx[k]||null:null;
}
function allWords(){
  var cust=CW().map(function(c){return {key:'c:'+c.id,en:c.en,ru:c.ru,ex:c.ex||'',custom:true}});

// что показать сейчас: часть слов — на повторение (по сроку), остальное — новые; свои слова идут первыми
function pickWords(){
  var w=WS(), n=w.n, due=[], fresh=[];
  allWords().forEach(function(x){
    var p=w.p[x.key];
    if(!p) fresh.push(x); else if(p.d<=w.tick) due.push(x);
  });
  due.sort(function(a,b){return w.p[a.key].d-w.p[b.key].d});
  var take=due.slice(0,Math.ceil(n/2));
  var res=take.concat(fresh.slice(0,n-take.length));
  if(res.length<n) res=res.concat(due.slice(take.length,take.length+(n-res.length)));
  return res.map(function(x){return x.key});
}

  if(h) return h+' ч '+m+' мин';

};

function agg(a){

  return {total:(s.t0&&s.t1)?s.t1-s.t0:null,sets:agg(dur),restSets:agg(rs),restEx:agg(rx),tracked:!!(dur.length||rs.length||rx.length)};

function exBody(ses,ex){
  var ent=ses.entries[ex.id]||{sets:[],note:''};
  var prev=prevEntry(ex.id,ses), d=draft, editing=d.idx!==null;
  var chips=ent.sets.map(function(s,i){
    return '<button class="chip'+(d.idx===i?' sel':'')+'" data-a="selset" data-i="'+i+'">'+(i+1)+'. '+setLbl(s)+'</button>';
  }).join('');
  var h='<div class="exbody">';
  h+= prev
    ? '<div class="prev">Прошлый раз'+(prev.date?' ('+fmtDate(prev.date)+')':'')+': <b>'+esc(fmtSets(prev.e.sets))+'</b>'+(prev.e.note?' · '+esc(prev.e.note):'')+'</div>'
    : '<div class="prev">Пока нет истории по этому упражнению</div>';
  if(chips) h+='<div class="chips">'+chips+'</div>';
  if(exType(ex)==='t'){
    var sc=Math.max(0,Math.round(parseNum(d.s)));
    if(!editing){
      var sw=(ses.sw&&ses.sw.ex===ex.id)?ses.sw:null;
      h+=sw
        ? '<div class="swbox"><div class="swt" id="swtime">'+mmss(Math.max(0,Math.floor((Date.now()-sw.start)/1000)))+'</div><button class="btn" data-a="swstop">'+ic('stop')+'Стоп</button></div>'
        : '<button class="btn swgo" data-a="swstart">'+ic('play')+'Начать подход</button>';
    }
    h+='<div class="lbl">Время</div><div class="stepper t">'+
       '<button class="btn" data-a="step" data-k="s" data-d="-1" aria-label="Меньше">'+ic('minus')+'</button>'+
       '<div class="tin"><label><input id="in-tm" data-in="tm" inputmode="numeric" value="'+Math.floor(sc/60)+'"><small>мин</small></label><b>:</b>'+
       '<label><input id="in-ts" data-in="ts" inputmode="numeric" value="'+pad(sc%60)+'"><small>сек</small></label></div>'+
       '<button class="btn" data-a="step" data-k="s" data-d="1" aria-label="Больше">'+ic('plus')+'</button></div>';
  } else {
    h+='<div class="lbl">Вес, кг</div><div class="stepper">'+
       '<button class="btn" data-a="step" data-k="w" data-d="-1" aria-label="Меньше">'+ic('minus')+'</button>'+
       '<input id="in-w" data-in="w" inputmode="decimal" value="'+num(parseNum(d.w))+'">'+
       '<button class="btn" data-a="step" data-k="w" data-d="1" aria-label="Больше">'+ic('plus')+'</button></div>';
    h+='<div class="lbl">Повторы</div><div class="stepper">'+
       '<button class="btn" data-a="step" data-k="r" data-d="-1" aria-label="Меньше">'+ic('minus')+'</button>'+
       '<input id="in-r" data-in="r" inputmode="numeric" value="'+num(parseNum(d.r))+'">'+
       '<button class="btn" data-a="step" data-k="r" data-d="1" aria-label="Больше">'+ic('plus')+'</button></div>';
  }
  if(editing){
    h+='<button class="btn primary big" data-a="log">Сохранить подход '+(d.idx+1)+'</button>';
  } else if(ent.sets.length){
    h+='<div class="logrow"><button class="btn primary big" data-a="log">Записать подход '+(ent.sets.length+1)+ic('check','r')+'</button>'+
       '<button class="btn big fin" data-a="finex">Завершить упражнение</button></div>';
  } else {
    h+='<button class="btn primary big" data-a="log">Записать подход 1'+ic('check','r')+'</button>';
  }
  if(editing) h+='<div class="row2"><button class="btn" data-a="cancelset">Отмена</button><button class="btn danger" data-a="delset">Удалить</button></div>';
  h+='<input class="note" data-in="note" data-ex="'+ex.id+'" placeholder="Заметка" value="'+esc(ent.note||'')+'">';
  return h+'</div>';
}

/* календарь: дни с тренировками отмечены точками */
var MONTHS=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
var MONTHS_G=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
var calM=null, calSel=null;   // calM — {y,m} показанный месяц, calSel — выбранный день «ГГГГ-ММ-ДД»
function calInit(){
  if(calM) return;
  var t=today().split('-'); calM={y:+t[0],m:+t[1]-1}; calSel=today();
}
function vCal(){
  calInit();
  var by={}, inMonth=0, pre=calM.y+'-'+pad(calM.m+1)+'-';
  S.sessions.forEach(function(s){
    if(!s.date) return;
    (by[s.date]||(by[s.date]=[])).push(s);
    if(s.date.indexOf(pre)===0) inMonth++;
  });
  var first=new Date(calM.y,calM.m,1), lead=(first.getDay()+6)%7, days=new Date(calM.y,calM.m+1,0).getDate(), td=today();
  var h='<div class="swapwrap" id="calwrap"><div class="swapin"><div class="card cal"><div class="calhead"><button class="back" data-a="calnav" data-d="-1" aria-label="Предыдущий месяц">'+ic('back')+'</button>'+
    '<b>'+MONTHS[calM.m]+' '+calM.y+'</b><button class="back" data-a="calnav" data-d="1" aria-label="Следующий месяц">'+ic('chev')+'</button></div>'+
    '<div class="calgrid">'+['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(function(x){return '<div class="calwd">'+x+'</div>'}).join('');
  for(var i=0;i<lead;i++) h+='<div></div>';
  for(var d=1;d<=days;d++){
    var ds=pre+pad(d), ss=by[ds]||[];
    h+='<button class="calday'+(ds===td?' today':'')+(ds===calSel?' sel':'')+'" data-a="calday" data-d="'+ds+'"'+
       ' aria-label="'+d+' '+MONTHS_G[calM.m]+(ss.length?', тренировок: '+ss.length:'')+'">'+d+
       '<span class="dd">'+ss.slice(0,3).map(function(s){return '<i'+(s.done?'':' class="act"')+' '+colStyle(sesCol(s))+'></i>'}).join('')+'</span></button>';
  }
  // легенда: какие тренировки были в этом месяце и каким цветом они отмечены
  var lg={}, lgh='';
  S.sessions.forEach(function(s){
    if(!s.date||s.date.indexOf(pre)!==0) return;
    var c=sesCol(s), key=(s.name||'')+'|'+c.k;
    if(!lg[key]){ lg[key]=1; lgh+='<span class="lgi"><i '+colStyle(c)+'></i>'+esc(s.name||'Тренировка')+'</span>'; }
  });
  h+='</div>'+(lgh?'<div class="callg">'+lgh+'</div>':'')+'<div class="calsum"><span>'+(inMonth?'Тренировок в месяце: <b>'+inMonth+'</b>':'В этом месяце тренировок нет')+'</span>'+
     ((calSel!==td||calM.y+'-'+pad(calM.m+1)!==td.slice(0,7))?'<button class="btn sm" data-a="caltoday">Сегодня</button>':'')+'</div></div></div></div>';
  if(calSel){
    var p=calSel.split('-'), sel=(by[calSel]||[]).slice().sort(function(a,b){return a.ts-b.ts});
    h+='<div class="gh">'+(+p[2])+' '+MONTHS_G[+p[1]-1]+(calSel===td?' · сегодня':'')+'</div>';
    if(sel.length) sel.forEach(function(s){h+=sesItem(s)});
    else h+='<div class="small">В этот день тренировок нет.</div>';
  }
  return h;
}

function vHistory(){
  var h0='<h1>История</h1><div class="seg s3"><button class="'+(hseg==='c'?'on':'')+'" data-a="hseg" data-v="c">Календарь</button><button class="'+(hseg==='s'?'on':'')+'" data-a="hseg" data-v="s">Тренировки</button><button class="'+(hseg==='e'?'on':'')+'" data-a="hseg" data-v="e">Упражнения</button></div>', h='';
  if(hseg==='c') h=vCal();
  else if(hseg==='s'){
    var list=S.sessions.slice().sort(function(a,b){
      var da=a.date||'', db=b.date||'';
      if(da!==db) return da<db?1:-1;
      return b.ts-a.ts;
    });
    if(!list.length) h+='<div class="small">Здесь появятся ваши тренировки.</div>';
    list.forEach(function(s){h+=sesItem(s)});
  } else {
    var map={};
    sessionsSorted().forEach(function(s){
      Object.keys(s.entries).forEach(function(k){
        var e=s.entries[k], n=norm(e.name);
        if(!e.sets.length||!n) return;
        var m=map[n]||(map[n]={name:e.name,last:0,count:0});
        m.name=e.name; m.last=s.ts; m.count++;
      });
    });
    var arr=Object.keys(map).map(function(k){return map[k]}).sort(function(a,b){return b.last-a.last});
    if(!arr.length) h+='<div class="small">Пока нет записанных упражнений.</div>';
    arr.forEach(function(m){
      h+='<button class="item" '+goAttr({t:'ex',name:m.name})+'><div class="title" style="font-size:19px">'+esc(m.name)+'</div><div class="small">тренировок: '+m.count+'</div></button>';
    });
  }
  return h0+'<div class="swapwrap" id="hwrap"><div class="swapin">'+h+'</div></div>';
}

function chart(vals){
  if(vals.length<2) return '';
  var W=300,Hh=90,p=10,mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),rg=(mx-mn)||1;
  var pts=vals.map(function(x,i){return [p+i*(W-2*p)/(vals.length-1),Hh-p-(x-mn)/rg*(Hh-2*p)]});
  return '<svg viewBox="0 0 '+W+' '+Hh+'" class="chart"><polyline points="'+pts.map(function(q){return q[0].toFixed(1)+','+q[1].toFixed(1)}).join(' ')+'" fill="none" stroke="#c8f53a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>'+
    pts.map(function(q){return '<circle cx="'+q[0].toFixed(1)+'" cy="'+q[1].toFixed(1)+'" r="4" fill="#c8f53a"/>'}).join('')+'</svg>';
}

function vEx(v){
  var name=v.name||'', n=norm(name), rows=[];
  sessionsSorted().forEach(function(s){
    Object.keys(s.entries).forEach(function(k){
      var e=s.entries[k];
      if(e.sets.length&&norm(e.name)===n) rows.push({s:s,e:e});
    });
  });
  var h=head(name);
  if(!rows.length) return h+'<div class="small">По этому упражнению пока нет записей.</div>';
  var isT=function(r){return r.e.sets.some(function(x){return x.s!=null})};
  var kT=isT(rows[rows.length-1]);
  var tops=rows.filter(function(r){return isT(r)===kT}).map(function(r){return Math.max.apply(null,r.e.sets.map(function(x){return kT?(x.s||0):x.w}))});
  var best=Math.max.apply(null,tops);
  h+='<div class="card"><div class="small nm">'+(kT?'Максимальное время по тренировкам':'Максимальный вес по тренировкам')+'</div><div class="title">'+(kT?fmtT(best):num(best)+' кг')+' <span class="small nm" style="font-weight:400">рекорд</span></div>'+chart(tops)+'</div>';
  h+='<div class="card">';
  rows.slice().reverse().forEach(function(r){
    var p=progById(r.s.programId);
    h+='<div class="hrow"><div class="d">'+fmtDate(r.s.date)+(p?' · '+esc(p.name)+((p.run||1)>1?' (повтор '+p.run+')':''):'')+'</div><div class="v">'+esc(fmtSets(r.e.sets))+'</div>'+(r.e.note?'<div class="n">'+esc(r.e.note)+'</div>':'')+'</div>';
  });
  return h+'</div>';
}

/* выбор из базы / список базы */
function pickBody(v){
  var pick=v.t==='expick', w=pick?wkOf(v):null;
  var q=exq.trim().replace(/\s+/g,' '), nq=norm(q), st=libStats(), exact=null, h='';
  var cmp=function(a,b){
    var x=(st[norm(a.name)]||{last:0}).last, y=(st[norm(b.name)]||{last:0}).last;
    return (y-x)||a.name.localeCompare(b.name,'ru');
  };
  var lst, sims=[];
  if(nq){
    var a1=[],b1=[];
    S.lib.forEach(function(l){
      var n=norm(l.name); if(n===nq) exact=l;
      if(n.indexOf(nq)>=0) a1.push(l); else if(simil(l.name,q)) b1.push(l);
    });
    a1.sort(cmp); b1.sort(cmp); sims=b1; lst=a1.concat(b1);
  } else lst=S.lib.slice().sort(cmp);
  var inW=function(l){return w&&w.exercises.some(function(e){return norm(e.name)===norm(l.name)})};
  if(nq&&sims.length&&!exact) h+='<div class="hint">Похоже на то, что уже есть в базе. Выберите из списка, чтобы не плодить дубли.</div>';
  if(lst.length){
    h+='<div class="gh">'+(nq?'Найдено в базе':'База упражнений')+'</div>';
    lst.forEach(function(l){
      var stt=st[norm(l.name)], info=(exType(l)==='t'?'время':'вес × повторы')+(stt?' · тренировок: '+stt.count:'');
      var attr=pick?'data-a="pickadd" data-id="'+l.id+'"':goAttr({t:'exitem',id:l.id});
      h+='<button class="item" '+attr+'><div class="title" style="font-size:19px">'+esc(l.name)+'</div><div class="small">'+info+(pick&&inW(l)?' · <span class="inw">'+ic('check')+' в тренировке</span>':'')+'</div></button>';
    });
  } else if(!nq){
    h+='<div class="small">База пока пуста. Введите название выше и создайте первое упражнение.</div>';
  }
  if(nq&&!exact){
    h+='<div class="gh">Создать новое «'+esc(q)+'»</div>'+
       '<div class="row2 newex" style="margin-top:0">'+
         '<div><div class="small">Шаг веса</div><div class="chips">'+NEW_STEPS.map(function(x){return '<button class="chip'+(x===newStep?' sel':'')+'" data-a="newstep" data-v="'+x+'">'+num(x)+' кг</button>'}).join('')+'</div>'+
           '<button class="btn" data-a="newex" data-tp="w">Вес × повторы</button></div>'+
         '<div><div class="small">Шаг времени</div><div class="chips">'+NEW_TSTEPS.map(function(x){return '<button class="chip'+(x===newTStep?' sel':'')+'" data-a="newtstep" data-v="'+x+'">'+(x<60?x+' с':x/60+' мин')+'</button>'}).join('')+'</div>'+
           '<button class="btn" data-a="newex" data-tp="t">Время</button></div></div>';
  } else if(nq&&exact&&!lst.length){ h+=''; }
  return h;
}
function refreshPick(){var el=document.getElementById('exlist');if(el)el.innerHTML=pickBody(cur());}
function vPick(v){

     '<div class="rowx"><label>'+(tm?'Шаг времени, с':'Шаг веса, кг')+' <input data-in="libstep" inputmode="decimal" value="'+(tm?(l.tstep||30):num(l.step||2.5))+'"></label></div></div>';

function viewFor(v){
  switch(v.t){
    case 'home': return vHome();
    case 'history': return vHistory();
    case 'more': return vMore();
    case 'prog': return vProg(v);
    case 'session': return vSession(v);
    case 'ex': return vEx(v);
    case 'pedit': return vPedit(v);
    case 'wedit': return vWedit(v);
    case 'expick': case 'exlib': return vPick(v);
    case 'exitem': return vExItem(v);
    case 'cwords': return vCwords();
    case 'fday': case 'fprod': case 'fprog': case 'fmore': case 'fadd': case 'fscan': return vFood(v);
  }
  return vHome();
}

/* ---------- переходы между экранами как в iOS ---------- */
// «призрак» — снимок экрана в виде отдельного слоя поверх (или под) настоящего
var noAnim=false, renderedLen=1, renderedTab='home', animTok=0;
var EASE='cubic-bezier(.22,.8,.24,1)', DUR=340, PAR=26;   // PAR — на сколько % сдвигается нижний экран (параллакс)
/* две стороны: у каждой своё меню и своя «память» о том, где пользователь был */
var world='sport', tabsWorld=null, worldNav={sport:null,food:null};
var WT={sport:['home','history','more'],food:['fday','fprod','fprog','fmore']};
var WHOME={sport:'home',food:'fday'};
var TABDEF={home:['dumbbell','Программы'],history:['trend','История'],more:['sliders','Ещё'],
  fday:['utensils','День'],fprod:['apple','Продукты'],fprog:['cal','Прогресс'],fmore:['sliders','Ещё']};
function tabsHtml(w){
  return WT[w].map(function(t){return '<button data-a="tab" data-t="'+t+'">'+ic(TABDEF[t][0])+TABDEF[t][1]+'</button>'}).join('');
}
function buildTabs(){document.getElementById('tabs').innerHTML=tabsHtml(world); tabsWorld=world;}
// переключение стороны без анимации (анимацию делает жест). Меню и акцент меняются здесь же.
function switchWorldRaw(to){
  if(to===world) return;
  worldNav[world]=nav; world=to;
  nav=worldNav[to]||[{t:WHOME[to]}];
  exq='';
  document.documentElement.classList.toggle('wf',to==='food');
}
function switchWorld(to){
  if(to===world||modal) return;
  var was=noAnim; noAnim=true;
  switchWorldRaw(to); S.settings.world=to; save();
  render(); window.scrollTo(0,0);
  noAnim=was;
}
var canAnim=function(){
  var a=document.getElementById('app');
  return !(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)&&!document.hidden&&!!a&&!!a.animate;
};
function makeGhost(app,cls){
  Array.prototype.forEach.call(document.querySelectorAll('.ghost'),function(x){x.remove()});
  var g=document.createElement('div'); g.className='ghost'+(cls?' '+cls:'')+(world==='food'?' wf':' ws');
  g.innerHTML='<div class="gin" style="transform:translateY(-'+(window.scrollY||0)+'px)">'+app.innerHTML.replace(/ id="[^"]*"/g,'')+'</div>';
  document.body.appendChild(g);
  return g;
}
// общая «уборка» после анимации; tok защищает от запоздавшей уборки, если уже запущена следующая анимация
function finisher(g,app,tok,cls){
  var done=false;
  return function(){
    if(done) return; done=true;
    if(g&&g.parentNode) g.remove();
    if(tok===animTok){
      if(cls) app.classList.remove(cls);
      app.getAnimations().forEach(function(a){a.cancel()});
    }
  };
}
// вперёд: новый экран выезжает справа, прежний сдвигается влево и темнеет
function pushAnim(g,app){
  var tok=++animTok, fin=finisher(g,app,tok,'pushing');
  app.classList.add('pushing');
  g.animate([{transform:'translateX(0)',opacity:1},{transform:'translateX(-'+PAR+'%)',opacity:.45}],{duration:DUR,easing:EASE,fill:'forwards'});
  var a=app.animate([{transform:'translateX(100%)'},{transform:'none'}],{duration:DUR,easing:EASE});
  a.onfinish=fin; setTimeout(fin,DUR+250);   // страховка: слой не должен остаться на экране
}
// назад: старый экран уезжает вправо, из-под него выезжает предыдущий (с затемнением)
function popAnim(g,app){
  var tok=++animTok, fin=finisher(g,app,tok);
  var opt={duration:DUR,easing:EASE};
  g.animate([{transform:'translateX(0)'},{transform:'translateX(100%)'}],opt).onfinish=fin;
  app.animate([{transform:'translateX(-'+PAR+'%)',opacity:.45},{transform:'none',opacity:1}],opt);
  setTimeout(fin,DUR+250);
}
// смена вкладки: экраны сдвигаются бок о бок в сторону, зависящую от порядка вкладок
function tabAnim(g,app,dir){
  var tok=++animTok, fin=finisher(g,app,tok);
  var opt={duration:300,easing:EASE};
  g.classList.add('flat');
  g.animate([{transform:'translateX(0)'},{transform:'translateX('+(-dir*100)+'%)'}],opt).onfinish=fin;
  app.animate([{transform:'translateX('+(dir*100)+'%)'},{transform:'none'}],opt);
  setTimeout(fin,300+250);
}
// какая это смена экрана: tab / push / pop / null
function navKind(oldLen,oldTab){
  if(nav[0].t!==oldTab) return 'tab';
  if(nav.length>oldLen) return 'push';
  if(nav.length<oldLen) return 'pop';
  return null;
}
// содержимое внутри экрана (переключатель «Календарь / Тренировки / Упражнения», месяцы): снимок до и слайд после render()
function swapSnap(sel){
  var w=document.querySelector(sel), inn=w&&w.firstElementChild;
  return inn?inn.innerHTML.replace(/ id="[^"]*"/g,''):null;
}
function swapAnim(sel,oldHtml,dir){
  var w=document.querySelector(sel), inn=w&&w.firstElementChild;
  if(!inn||oldHtml==null||!canAnim()||!inn.animate) return;
  Array.prototype.forEach.call(w.querySelectorAll('.swapout'),function(x){x.remove()});
  var g=document.createElement('div'); g.className='swapout'; g.innerHTML=oldHtml;
  w.appendChild(g);
  var opt={duration:300,easing:EASE}, off='calc(100% + 16px)';
  var done=false, fin=function(){ if(done) return; done=true; if(g.parentNode) g.remove(); inn.getAnimations().forEach(function(a){a.cancel()}); };
  g.animate([{transform:'translateX(0)'},{transform:'translateX('+(dir>0?'calc(-1 * '+off+')':off)+')'}],opt).onfinish=fin;
  inn.animate([{transform:'translateX('+(dir>0?off:'calc(-1 * '+off+')')+')'},{transform:'none'}],opt);
  setTimeout(fin,300+250);
}
// закрытие окна итогов: плавное исчезновение
function fadeOutModal(m){
  var c=m.cloneNode(true); c.style.animation='none'; c.style.pointerEvents='none';
  var mc=c.querySelector('.mcard'); if(mc) mc.style.animation='none';
  c.querySelectorAll('[id]').forEach(function(x){x.removeAttribute('id')});
  document.body.appendChild(c);
  var done=false, fin=function(){ if(done) return; done=true; c.remove(); };
  c.animate([{opacity:1},{opacity:0}],{duration:200,easing:'ease-out'}).onfinish=fin;
  if(mc) mc.animate([{transform:'none'},{transform:'translateY(10px) scale(.98)'}],{duration:200,easing:'ease-out'});
  setTimeout(fin,450);
}
function render(){
  var app=document.getElementById('app'), oldLen=renderedLen, oldTab=renderedTab;
  var kind=(!noAnim&&canAnim())?navKind(oldLen,oldTab):null;
  var ghost=kind?makeGhost(app,kind==='push'?'under':''):null;   // снимок до подмены содержимого
  var oldModal=(!noAnim&&canAnim())?app.querySelector('.modal'):null;
  var html=viewFor(cur());
  if(modal) html+=modalHtml();
  app.innerHTML=html;
  var v2=cur(), tab=nav[0].t;
  document.getElementById('tabs').style.display=(v2.t==='session')?'none':'flex';
  if(tabsWorld!==world) buildTabs();
  Array.prototype.forEach.call(document.querySelectorAll('#tabs button'),function(b){b.classList.toggle('on',b.dataset.t===tab)});
  wake(v2.t==='session');
  if(v2.t==='fscan') startScan(); else stopScan();
  tick();
  if(ghost){
    if(navKind(oldLen,oldTab)!==kind) ghost.remove();   // экран по дороге перестроился (например, удалённый объект)
    else if(kind==='push') pushAnim(ghost,app);
    else if(kind==='pop') popAnim(ghost,app);
    else tabAnim(ghost,app,WT[world].indexOf(tab)>=WT[world].indexOf(oldTab)?1:-1);
  }
  if(oldModal&&!modal) fadeOutModal(oldModal);
  renderedLen=nav.length; renderedTab=nav[0].t;
}
var toTop=function(){window.scrollTo(0,0)};

// окно ввода названия в стиле приложения (вместо системного prompt): askText({title,hint,value,ok,cb})
function dlgOpen(inner,cls){
  var old=document.getElementById('dlg'); if(old) old.remove();
  var d=document.createElement('div'); d.id='dlg'; d.className='modal dlg'+(cls?' '+cls:'');
  d.innerHTML='<div class="mcard">'+inner+'</div>';
  document.body.appendChild(d);
  // клавиатура iPhone не должна закрывать кнопки: окно подгоняется под видимую область, карточка при нужде прокручивается
  var vv=window.visualViewport;
  if(vv){
    var fit=function(){
      d.style.top=vv.offsetTop+'px'; d.style.bottom='auto'; d.style.height=vv.height+'px';
      var mc=d.querySelector('.mcard'); if(mc) mc.style.maxHeight=Math.max(240,vv.height-24)+'px';
    };
    vv.addEventListener('resize',fit); vv.addEventListener('scroll',fit); fit();
    d._unfit=function(){vv.removeEventListener('resize',fit); vv.removeEventListener('scroll',fit);};
  }
  return d;
}
function dlgClose(d){
  if(d._closed) return; d._closed=true;
  if(d._unfit) d._unfit();
  var a=document.activeElement; if(a&&d.contains(a)&&a.blur) a.blur();
  if(!canAnim()||!d.animate){d.remove();return;}
  d.style.pointerEvents='none';
  var mc=d.querySelector('.mcard'); d.style.animation='none'; if(mc) mc.style.animation='none';
  d.animate([{opacity:1},{opacity:0}],{duration:180,easing:'ease-out'}).onfinish=function(){d.remove()};
  setTimeout(function(){d.remove()},450);
}
// окно подтверждения в стиле приложения (вместо системного confirm): askConfirm({title,text,ok,danger,cb,no})
function askConfirm(o){
  var d=dlgOpen('<div class="title" style="margin-bottom:6px">'+esc(o.title||'Подтвердите')+'</div>'+
    (o.text?'<div class="small" style="margin:0">'+esc(o.text)+'</div>':'')+
    '<div class="stack"><button class="btn cta '+(o.danger?'dng':'primary')+'" data-dlg="ok">'+esc(o.ok||'Да')+'</button>'+
    '<button class="btn cta" data-dlg="no">Отмена</button></div>','center');
  d.addEventListener('click',function(e){
    if(e.target.closest('[data-dlg=ok]')){ dlgClose(d); if(o.cb) o.cb(); }
    else if(e.target.closest('[data-dlg=no]')||e.target===d){ dlgClose(d); if(o.no) o.no(); }
  });
}
// выбор цвета: сетка кружков, нажатие сразу применяет и закрывает окно
function askColor(o){
  var d=dlgOpen('<div class="title" style="margin-bottom:2px">Цвет тренировки</div>'+
    '<div class="small" style="margin:0">'+esc(o.title||'')+'</div>'+
    '<div class="swgrid">'+PAL.map(function(c){
      var on=c.k===o.cur;
      return '<button class="swc'+(on?' on':'')+'" '+colStyle(c)+' data-c="'+c.k+'" aria-label="'+c.n+(on?' (выбран)':'')+'">'+(on?ic('check'):'')+'</button>';
    }).join('')+'</div>','center');
  d.addEventListener('click',function(e){
    var b=e.target.closest('[data-c]');
    if(b){ dlgClose(d); if(b.dataset.c!==o.cur) o.cb(b.dataset.c); }
    else if(e.target===d) dlgClose(d);
  });
}
function askText(o){
  var d=dlgOpen('<div class="title" style="margin-bottom:14px">'+esc(o.title)+'</div>'+
    '<input class="text" id="dlg-in" autocomplete="off" autocapitalize="sentences" enterkeyhint="done" maxlength="60" placeholder="'+esc(o.hint||'')+'" value="'+esc(o.value||'')+'">'+
    '<div class="row2"><button class="btn cta" data-dlg="no">Отмена</button><button class="btn primary cta" data-dlg="ok">'+esc(o.ok||'Готово')+'</button></div>');
  var inp=d.querySelector('#dlg-in'), okb=d.querySelector('[data-dlg=ok]');
  var sync=function(){okb.disabled=!inp.value.trim();};
  var close=function(){dlgClose(d)};
  var submit=function(){
    var v=inp.value.trim(); if(!v) return;
    close(); o.cb(v);
  };
  inp.addEventListener('input',sync);
  inp.addEventListener('keydown',function(e){
    if(e.key==='Enter'){e.preventDefault();submit();}
    else if(e.key==='Escape'){close();}
  });
  d.addEventListener('click',function(e){

// «Назад» свайпом: экран едет за пальцем. Под ним сразу показывается предыдущий экран; отпустили далеко/быстро — уходим, нет — возвращаем
var pend=null, drag=null;
function dragStart(x0){

  drag={g:g,app:app,entry:entry,exq0:exq0,ys:ys,W:window.innerWidth,x0:x0,dx:0,fin:false,samples:[]};
  app.style.transform='translateX(-'+PAR+'%)'; app.style.opacity='.45';
}
function dragMove(x){
  var d=drag, dx=Math.max(0,Math.min(d.W,x-d.x0)), p=dx/d.W, now=Date.now();

}
function dragEnd(cancelled){

  var s0=d.samples.find(function(s){return now-s.t<=120})||d.samples[0];
  var v=(s0&&now>s0.t)?(dx-s0.x)/(now-s0.t):0;       // скорость пальца, px/мс
  var go=!cancelled&&(dx>W*0.38||(v>0.45&&dx>30));
  var dur=Math.max(230,Math.round(DUR*(go?1-p:p)));   // не короче 230 мс, чтобы доезд не выглядел рывком
  var curT=-PAR*(1-p), curO=.45+.55*p, opt={duration:dur,easing:'cubic-bezier(.25,.8,.3,1)',fill:'forwards'};
  var done=false, fin=function(){
    if(done) return; done=true;
    if(!go){            // отменили: возвращаем исходный экран
      noAnim=true; nav.push(d.entry); exq=d.exq0; render(); window.scrollTo(0,d.ys); noAnim=false;
    }
    if(d.g.parentNode) d.g.remove();

  } else {

  }

}
// Смена стороны (Спорт ⇄ Питание) свайпом по нижнему меню: экран и меню едут за пальцем бок о бок.
// Спорт слева, Питание справа: палец влево — в Питание, вправо — обратно в Спорт.
var wpend=null;

}

  var v=(s0&&now>s0.t)?(adx-s0.x)/(now-s0.t):0;
  var go=!cancelled&&(adx>W*0.33||(v>0.45&&adx>30));
  var dur=Math.max(230,Math.round(DUR*(go?1-p:p))), opt={duration:dur,easing:'cubic-bezier(.25,.8,.3,1)',fill:'forwards'};
  var newFrom=-dir*W+d.dx;

    if(d.g.parentNode) d.g.remove();

// Важно: жест может начаться на карточке или кнопке, а при старте жеста экран перерисовывается и этот элемент удаляется.
// iOS после этого шлёт события движения пальца только удалённому элементу, до document они не доходят (жест «замирал»).

function onTM(e){

    if(!drag.fin){ if(e.cancelable) e.preventDefault(); (drag.kind==='world'?wDragMove:dragMove)(t.clientX); }
    return;
  }

    if(!canAnim()) return;

// страховка: если жест «потерялся» (события перестали приходить), возвращаем экран на место

/* ========== ПИТАНИЕ: данные и расчёты ========== */
var MEALS=[{k:'b',n:'Завтрак'},{k:'l',n:'Обед'},{k:'d',n:'Ужин'},{k:'s',n:'Перекус'}];
// перекусов в дне может быть несколько: ключи 's', 's2', 's3'…; число секций хранится в днях (sn) и не меньше номера последней записи
function snackCount(ds){
  var d=F().days[ds], n=(d&&d.sn)||1;
  if(d) d.e.forEach(function(e){var m=/^s(\d+)$/.exec(e.m); if(m&&+m[1]>n) n=+m[1];});
  return n;
}
function snackName(k,total){var i=k==='s'?1:+k.slice(1); return total>1?'Перекус '+i:'Перекус';}
function mealsFor(ds){

  return a;
}
var mealName=function(k,ds){
  if(/^s\d*$/.test(k)) return snackName(k,snackCount(ds||fd()));
  var m=MEALS.find(function(x){return x.k===k}); return m?m.n:'Приём';
};
var mealByTime=function(){var h=new Date().getHours();return h<11?'b':h<16?'l':h<21?'d':'s'};
var ACTS=[
  {k:1.2,n:'Минимальная',t:'Сидячая работа, почти нет тренировок'},
  {k:1.375,n:'Лёгкая',t:'1–3 тренировки в неделю'},
  {k:1.55,n:'Умеренная',t:'3–5 тренировок в неделю'},
  {k:1.725,n:'Высокая',t:'6–7 тренировок в неделю'},
  {k:1.9,n:'Очень высокая',t:'Тяжёлый труд или два занятия в день'}
];
var GOALS={lose:{n:'Похудение',prot:2.0},keep:{n:'Поддержание',prot:1.7},gain:{n:'Набор',prot:1.8}};
var MC={p:{n:'Белки',s:'Б',c:'#4cc9f0',r:'76,201,240'},f:{n:'Жиры',s:'Ж',c:'#ffb02e',r:'255,176,46'},c:{n:'Углеводы',s:'У',c:'#9b7bff',r:'155,123,255'}};
var CATS={kr:'Крупы и макароны',hl:'Хлеб и выпечка',ms:'Мясо и птица',ry:'Рыба и морепродукты',ml:'Молочное',yj:'Яйца',ov:'Овощи и бобовые',fr:'Фрукты и ягоды',or:'Орехи и семена',ma:'Масла и соусы',sl:'Сладкое',nap:'Напитки',gb:'Готовые блюда',pr:'Прочее',my:'Мои продукты'};
var WD=['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
var WDS=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
var r1=function(n){return Math.round((+n||0)*10)/10};
var fnum=function(n){return num(r1(n))};
var clampN=function(v,a,b){return Math.max(a,Math.min(b,v))};

// все данные питания лежат в S.food (отдельно от тренировок), попадают в резервную копию
function F(){
  var f=S.food; if(!f||typeof f!=='object') f=S.food={};
  f.profile=f.profile||{sex:'m',age:0,h:0,w:0,act:1.375};
  var g=f.goal=f.goal||{type:'lose',mode:'auto'};
  if(!GOALS[g.type]) g.type='lose';
  if(g.mode!=='manual') g.mode='auto';
  g.adj=g.adj||{lose:-15,keep:0,gain:10};
  g.manual=g.manual||{k:0,p:0,f:0,c:0};
  if(g.bonus==null) g.bonus=150;
  if(!(f.tol>=3&&f.tol<=20)) f.tol=7;
  f.days=f.days||{}; f.foods=f.foods||[]; f.meals=f.meals||[]; f.weights=f.weights||[]; f.last=f.last||{};
  if(f.tw==null) f.tw=0;
  return f;
}

/* даты */
function dObj(ds){var p=ds.split('-');return new Date(+p[0],+p[1]-1,+p[2],12)}
function dStr(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function addD(ds,n){var d=dObj(ds);d.setDate(d.getDate()+n);return dStr(d)}
function weekStartOf(ds){var d=dObj(ds),k=(d.getDay()+6)%7;d.setDate(d.getDate()-k);return dStr(d)}
function longDate(ds){var d=dObj(ds);return WD[d.getDay()]+', '+d.getDate()+' '+MONTHS_G[d.getMonth()]}
function shortDate(ds){var d=dObj(ds);return d.getDate()+' '+MONTHS_G[d.getMonth()].slice(0,3)}
function daysBetween(a,b){return Math.round((dObj(b)-dObj(a))/86400000)}

/* записи дня */
function dayOf(ds,mk){var f=F(),d=f.days[ds]; if(!d&&mk) d=f.days[ds]={e:[]}; return d}
function entriesOf(ds){var d=F().days[ds];return d?d.e:[]}
function sumE(es){var t={k:0,p:0,f:0,c:0};es.forEach(function(e){t.k+=e.k||0;t.p+=e.p||0;t.f+=e.f||0;t.c+=e.c||0});return t}

/* цели: расчёт по формуле Миффлина — Сан-Жеора или ручной ввод */
function calcTarget(){
  var f=F(), g=f.goal, p=f.profile;
  if(g.mode==='manual'){
    var m=g.manual; if(!(m.k>0)) return null;
    var c=m.c>0?m.c:Math.max(0,Math.round((m.k-4*(m.p||0)-9*(m.f||0))/4));
    return {k:Math.round(m.k),p:Math.round(m.p||0),f:Math.round(m.f||0),c:Math.round(c)};
  }
  if(!(p.age>0&&p.h>0&&p.w>0)) return null;
  var bmr=10*p.w+6.25*p.h-5*p.age+(p.sex==='f'?-161:5);
  var tdee=bmr*p.act, adj=g.adj[g.type]||0;
  var k=Math.round(tdee*(1+adj/100)/10)*10, floor=p.sex==='f'?1200:1500; if(k<floor) k=floor;   // нижняя граница
  var pr=Math.round(p.w*GOALS[g.type].prot), fat=Math.round(p.w*0.9);
  var c=Math.max(0,Math.round((k-4*pr-9*fat)/4));
  return {k:k,p:pr,f:fat,c:c,bmr:Math.round(bmr),tdee:Math.round(tdee)};
}
function hasTraining(ds){return S.sessions.some(function(s){return s.date===ds})}
// цель на конкретный день: в день тренировки добавляется бонус (в углеводы)
function targetFor(ds){
  var b=calcTarget(); if(!b) return null;
  var bonus=F().goal.bonus||0;
  if(bonus>0&&hasTraining(ds)) return {k:b.k+bonus,p:b.p,f:b.f,c:b.c+Math.round(bonus/4),tr:bonus};
  return {k:b.k,p:b.p,f:b.f,c:b.c};
}
// прошедшие дни хранят «замороженную» цель: смена целей их не перекрашивает. Сегодня и будущее считаются по текущим целям.
function tOf(ds){var d=F().days[ds]; if(ds<today()&&d&&d.t) return d.t; return targetFor(ds);}
function snapPast(){
  var f=F(), t0=today(), ch=false;
  Object.keys(f.days).forEach(function(ds){
    var d=f.days[ds];
    if(ds<t0&&d.e.length&&!d.t){var t=targetFor(ds); if(t){d.t=t;ch=true}}
  });
  if(ch) save();
}

/* оценка дня по калориям; допуск задаётся в настройках */
function ratioStatus(r,type){
  var tol=F().tol/100;
  if(type==='lose'){ if(r>=0.75&&r<=1) return 'hit'; if(r>1&&r<=1+tol) return 'near'; return 'miss'; }
  if(type==='keep'){
    if(r>=1-tol&&r<=1+tol) return 'hit';
    if((r>=1-tol-0.05&&r<1-tol)||(r>1+tol&&r<=1+tol+0.05)) return 'near';
    return 'miss';
  }
  if(r>=1-tol&&r<=1.15) return 'hit';
  if((r>=1-tol-0.08&&r<1-tol)||(r>1.15&&r<=1.25)) return 'near';
  return 'miss';
}
function lowBound(type){return type==='lose'?0.75:(1-F().tol/100)}
function dayStat(ds){
  var es=entriesOf(ds), res={has:es.length>0,tot:sumE(es),t:null,st:null,pct:0,r:0,pHit:false};
  if(!res.has) return res;
  var t=tOf(ds); res.t=t; if(!t) return res;
  var type=F().goal.type, r=res.tot.k/t.k;
  res.r=r; res.pct=Math.min(100,Math.round(r*100));
  var st=ratioStatus(r,type);
  if(ds===today()&&r<lowBound(type)) st='now';      // день ещё идёт: недобор промахом не считаем
  res.st=st; res.pHit=t.p>0&&res.tot.p>=t.p*0.9;
  return res;
}
var stCls=function(st){return st==='hit'?'rh':st==='near'?'rn':st==='miss'?'rm':st==='now'?'rw':''};
var stName=function(st){return st==='hit'?'В цели':st==='near'?'Почти':st==='miss'?'Мимо цели':'День идёт'};
// серия подряд идущих дней «в цель»; сегодняшний день, пока он идёт, серию не прерывает
function streak(){
  var d=today(), s=dayStat(d), n=0;
  if(s.has&&s.st==='hit') n=1;
  else if(s.has&&s.st!=='now') return 0;
  for(d=addD(d,-1);n<2000;d=addD(d,-1)){
    s=dayStat(d);
    if(s.has&&s.st==='hit') n++; else break;
  }
  return n;
}
// сводка за период [from..to] включительно: только дни с записями и завершённые
function periodStat(from,to){
  var days=0,hit=0,near=0,miss=0,kc=0,pr=0,n=0;
  for(var d=from;d<=to;d=addD(d,1)){
    var s=dayStat(d); if(!s.has) continue;
    kc+=s.tot.k; pr+=s.tot.p; n++;
    if(!s.st||s.st==='now') continue;
    days++; if(s.st==='hit') hit++; else if(s.st==='near') near++; else miss++;
  }
  return {tracked:n,done:days,hit:hit,near:near,miss:miss,avgK:n?kc/n:0,avgP:n?pr/n:0};
}

/* вес */
function weightsSorted(){return F().weights.slice().sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:0})}
function weightOn(ds){var w=F().weights.find(function(x){return x.d===ds});return w?w.kg:null}
function lastWeight(upTo){
  var ws=weightsSorted().filter(function(x){return !upTo||x.d<=upTo});
  return ws.length?ws[ws.length-1]:null;
}
function setWeight(ds,kg){
  var f=F(), i=f.weights.findIndex(function(x){return x.d===ds});
  if(kg>0){ if(i>=0) f.weights[i].kg=kg; else f.weights.push({d:ds,kg:kg}); }
  else if(i>=0) f.weights.splice(i,1);
  var lw=lastWeight();       // для расчёта нормы берём самую свежую запись веса
  if(lw&&f.profile.w!==lw.kg){ snapPast(); f.profile.w=lw.kg; }
  save();
}
// тренд: среднее за окно в 7 дней, чтобы шум одного дня не пугал
function trendPoints(ws){
  return ws.map(function(w){
    var from=addD(w.d,-6), s=0, n=0;
    ws.forEach(function(x){ if(x.d>=from&&x.d<=w.d){s+=x.kg;n++} });
    return {d:w.d,kg:s/n};
  });
}

/* вода */
function waterGoal(){var w=F().profile.w; return w>0?Math.round(w*33/50)*50:2000}
function waterOf(ds){var d=F().days[ds];return d&&d.wm?d.wm:0}
function addWater(ds,ml){var d=dayOf(ds,true); d.wm=Math.max(0,(d.wm||0)+ml); save();}

/* ---------- продукты ---------- */
var FMAP={'ё':'е','і':'и','ї':'и','є':'е','ґ':'г'};
function fnorm(s){return String(s||'').toLowerCase().replace(/[ёіїєґ]/g,function(c){return FMAP[c]}).replace(/[^a-zа-я0-9% ]/g,' ').replace(/\s+/g,' ').trim()}
var FB=null;
// встроенная база (foods.js): «название|синонимы;через;точку с запятой|ккал|Б|Ж|У|порция:граммы|категория», всё на 100 г
function builtinFoods(){
  if(FB) return FB;
  FB=[];
  (window.FOODS_DB||[]).forEach(function(s,i){
    var q=s.split('|'); if(q.length<6) return;
    var por=null; if(q[6]){var pp=q[6].split(':'); if(pp[1]) por={l:pp[0],g:+pp[1]}}
    var o={id:'b'+i,idx:i,n:q[0],al:(q[1]||'').split(';').filter(Boolean),k:+q[2],p:+q[3],f:+q[4],c:+q[5],por:por,cat:q[7]||'pr',b:1};
    o.hay=fnorm(o.n+' '+o.al.join(' ')); o.words=o.hay.split(' '); o.nn=fnorm(o.n);
    FB.push(o);
  });
  return FB;
}
function customFoods(){
  return F().foods.map(function(f){
    var o=Object.assign({},f); o.cat='my'; o.b=0;
    o.hay=fnorm(o.n+' '+(o.al||[]).join(' ')); o.words=o.hay.split(' '); o.nn=fnorm(o.n);
    return o;
  });
}
function foodById(id){
  if(!id) return null;
  return customFoods().find(function(x){return x.id===id})||builtinFoods().find(function(x){return x.id===id})||null;
}
// сколько раз продукт добавляли: поднимает привычные продукты в поиске
function usageCount(){
  var u={}; var f=F();
  Object.keys(f.days).forEach(function(ds){f.days[ds].e.forEach(function(e){if(e.fid) u[e.fid]=(u[e.fid]||0)+1})});
  return u;
}
function searchFoods(q,cat,limit){
  var nq=fnorm(q), all=customFoods().concat(builtinFoods());
  if(cat&&cat!=='all') all=all.filter(function(f){return f.cat===cat});
  if(!nq) return all.slice(0,limit||60);
  var toks=nq.split(' '), use=usageCount(), res=[];
  all.forEach(function(f){
    var sc=0, ok=true, fz=false;
    for(var i=0;i<toks.length;i++){
      var t=toks[i], s=0;
      if(f.words.indexOf(t)>=0) s=4;
      else if(f.words.some(function(w){return w.indexOf(t)===0})) s=3;
      else if(f.hay.indexOf(t)>=0) s=1.5;
      else if(t.length>=5&&f.words.some(function(w){return w.charAt(0)===t.charAt(0)&&w.length>=t.length-1&&lev(w.slice(0,t.length),t)<=1})){ s=1; fz=true; }   // опечатки: только для слов от 5 букв
      if(!s){ok=false;break}
      sc+=s;
    }
    if(!ok) return;
    if(f.nn.indexOf(toks[0])===0) sc+=2;
    if(!f.b) sc+=1.5;
    sc+=Math.min(3,(use[f.id]||0)*0.5);
    sc-=f.nn.length*0.004+(f.idx||0)*0.001;      // при равной релевантности — в порядке списка (самое частое выше)
    res.push({f:f,s:sc,fz:fz});
  });
  if(res.some(function(x){return !x.fz})) res=res.filter(function(x){return !x.fz});   // есть точные совпадения — опечаточные не показываем
  res.sort(function(a,b){return b.s-a.s});
  return res.slice(0,limit||60).map(function(x){return x.f});
}
// продукт из записи дня (для «недавних» и «частых»)
function foodFromEntry(e){
  var fo=foodById(e.fid);
  if(fo) return fo;
  if(e.per) return {id:null,ref:e.id,n:e.n,k:e.per.k,p:e.per.p,f:e.per.f,c:e.per.c,por:e.por||null,al:[],cat:'my',b:0};
  return null;
}
function recentFoods(limit){
  var f=F(), all=[];
  Object.keys(f.days).forEach(function(ds){f.days[ds].e.forEach(function(e){if(e.per) all.push(e)})});
  all.sort(function(a,b){return (b.ts||0)-(a.ts||0)});
  var seen={}, out=[];
  for(var i=0;i<all.length&&out.length<limit;i++){
    var key=all[i].fid||('n:'+norm(all[i].n)); if(seen[key]) continue; seen[key]=1;
    var fo=foodFromEntry(all[i]); if(fo) out.push(fo);
  }
  return out;
}
function frequentFoods(limit){
  var f=F(), cnt={}, ent={};
  Object.keys(f.days).forEach(function(ds){f.days[ds].e.forEach(function(e){
    if(!e.per) return; var key=e.fid||('n:'+norm(e.n)); cnt[key]=(cnt[key]||0)+1; ent[key]=e;
  })});
  return Object.keys(cnt).filter(function(k){return cnt[k]>=2}).sort(function(a,b){return cnt[b]-cnt[a]}).slice(0,limit)
    .map(function(k){return foodFromEntry(ent[k])}).filter(Boolean);
}

function entryFromFood(meal,fo,grams,qty,unit){

  return {id:uid(),m:meal,n:fo.n,g:grams,q:qty,u:unit,fid:fo.id||null,per:{k:fo.k,p:fo.p,f:fo.f,c:fo.c},por:fo.por||null,
    k:Math.round(fo.k*m),p:r1(fo.p*m),f:r1(fo.f*m),c:r1(fo.c*m),ts:Date.now()};
}
function addEntryTo(ds,e){
  var d=dayOf(ds,true); d.e.push(e);

function weekStrip(sel){

    '<button class="back" data-a="fwk" data-d="1" aria-label="Следующая неделя">'+ic('chev')+'</button></div><div class="wk">';
  for(var i=0;i<7;i++){
    var ds=addD(ws,i), st=dayStat(ds);
    h+='<button class="wkd'+(ds===sel?' sel':'')+(ds===td?' today':'')+'" data-a="fdsel" data-d="'+ds+'"><span class="wl">'+WDS[(i+1)%7]+'</span>'+
      '<span class="rgw">'+(st.has&&st.t?ring(st.pct,stCls(st.st)):(st.has?'<i class="hd"></i>':''))+'<b>'+dObj(ds).getDate()+'</b></span></button>';
  }

}
function sumCard(ds){
  var tot=sumE(entriesOf(ds)), t=tOf(ds), st=dayStat(ds), h='<div class="card fsum">';
  if(t){
    var left=t.k-tot.k;
    h+='<div class="fhead"><div class="fkc"><span class="fbig">'+Math.round(tot.k)+'</span><span class="fof"> / '+t.k+' ккал</span></div>'+
      (st.has&&st.st&&st.st!=='now'?'<span class="stc '+stCls(st.st)+'">'+stName(st.st)+'</span>':'')+'</div>';
    h+=barHtml(tot.k,t.k,tot.k>t.k*(1+F().tol/100)?'over':'');
    h+='<div class="small" style="margin:8px 0 14px">'+(left>=0?'Осталось <b>'+Math.round(left)+'</b> ккал':'Выше цели на <b>'+Math.round(-left)+'</b> ккал')+
      (t.tr?' · день тренировки, +'+t.tr+' ккал':'')+'</div>';
  } else {
    h+='<div class="fhead"><div class="fkc"><span class="fbig">'+Math.round(tot.k)+'</span><span class="fof"> ккал</span></div></div>'+
      '<div class="small" style="margin:6px 0 12px">Цель пока не задана: без неё нельзя оценить день.</div>'+
      '<button class="btn cta primary" style="margin:0 0 14px" data-a="fgoal">Задать цель</button>';
  }
  return h+macroRows(tot,t)+'</div>';
}
function entSub(e){

    s+=' · ';
  }
  return s+'Б '+fnum(e.p)+' · Ж '+fnum(e.f)+' · У '+fnum(e.c);
}

function weightChart(ws){

function vFstats(){

  var avgT=tn?tgt/tn:0, top=Math.max(mxk,avgT*1.2,1), W=320,H=130,pl=4,pr=4,pt=8,pb=20, bw=(W-pl-pr)/list.length;

  h+='<div class="card"><div class="title" style="font-size:18px">Калории по дням</div><svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Калории по дням">'+tl+bars+
    '<text x="'+pl+'" y="'+(H-5)+'" class="gt">'+shortDate(from)+'</text><text x="'+(W-pr)+'" y="'+(H-5)+'" class="gt" text-anchor="end">'+shortDate(to)+'</text></svg></div>';
  h+='<div class="card sgrid"><div><span class="sl">В среднем</span><b>'+(ps.tracked?Math.round(ps.avgK):'—')+'</b><i>ккал в день</i></div><div><span class="sl">Белок</span><b>'+(ps.tracked?Math.round(ps.avgP):'—')+'</b><i>г в день</i></div>'+
    '<div><span class="sl">В цель</span><b>'+(ps.done?ps.hit+' / '+ps.done:'—')+'</b><i>оценённых дней</i></div><div><span class="sl">Серия</span><b>'+streak()+'</b><i>дн. подряд</i></div></div>';
  // недельный обзор: эта неделя против прошлой
  var ws0=weekStartOf(to), cur=periodStat(ws0,to), prev=periodStat(addD(ws0,-7),addD(ws0,-1));

  if(prev.tracked) wl.push('Прошлая неделя: <b>'+Math.round(prev.avgK)+'</b> ккал, белок <b>'+Math.round(prev.avgP)+'</b> г'+(prev.done?', в цель <b>'+prev.hit+'</b> из <b>'+prev.done+'</b>':'')+'.');

  return h;

// форма из полей: askForm({title,text,fields:[{k,l,v,u,t:'n'|'t',ph,req}],ok,del,cb(values),onDel})
// req: true — число > 0 / непустой текст; 'any' — просто не пусто
function askForm(o){
  var fl=o.fields;
  var inner='<div class="title" style="margin-bottom:6px">'+esc(o.title)+'</div>'+(o.text?'<div class="small" style="margin:0 0 6px">'+esc(o.text)+'</div>':'')+
    '<div class="dfields">'+fl.map(function(f){
      var val=f.v==null||f.v===0&&f.t==='n'&&!f.z?'':(f.t==='n'?num(f.v):f.v);
      if(f.t==='n') return '<label class="frow dfr"><span>'+esc(f.l)+'</span><span class="fin"><input data-k="'+f.k+'" inputmode="decimal" autocomplete="off" placeholder="'+esc(f.ph||'0')+'" value="'+esc(val)+'">'+(f.u?'<em>'+esc(f.u)+'</em>':'')+'</span></label>';
      return '<label class="dfs"><span class="lbl">'+esc(f.l)+'</span><input class="text" data-k="'+f.k+'" autocomplete="off" autocapitalize="sentences" maxlength="60" placeholder="'+esc(f.ph||'')+'" value="'+esc(val)+'"></label>';
    }).join('')+'</div>'+
    '<div class="row2"><button class="btn cta" data-dlg="no">Отмена</button><button class="btn primary cta" data-dlg="ok">'+esc(o.ok||'Сохранить')+'</button></div>'+
    (o.del?'<button class="btn cta dnt" data-dlg="del" style="margin-top:10px">'+esc(o.del)+'</button>':'');
  var d=dlgOpen(inner,'hi'), ins=[].slice.call(d.querySelectorAll('input')), okb=d.querySelector('[data-dlg=ok]');
  var vals=function(){
    var r={}; ins.forEach(function(i){var f=fl.find(function(x){return x.k===i.dataset.k}); r[i.dataset.k]=f.t==='n'?parseNum(i.value):i.value.trim()}); return r;
  };
  var valid=function(){
    return fl.every(function(f){
      if(!f.req) return true;
      var i=ins.find(function(x){return x.dataset.k===f.k}), s=i.value.trim();
      if(f.req==='any') return s.length>0;
      return f.t==='n'?parseNum(s)>0:s.length>0;
    });
  };
  var sync=function(){okb.disabled=!valid();};
  var submit=function(){ if(!valid()) return; var r=vals(); dlgClose(d); o.cb(r); };
  ins.forEach(function(i){i.addEventListener('input',sync)});
  d.addEventListener('keydown',function(e){ if(e.key==='Enter'&&e.target.tagName==='INPUT'){e.preventDefault();submit();} });
  d.addEventListener('click',function(e){
    if(e.target.closest('[data-dlg=ok]')) submit();
    else if(e.target.closest('[data-dlg=del]')){ dlgClose(d); if(o.onDel) o.onDel(); }
    else if(e.target.closest('[data-dlg=no]')||e.target===d) dlgClose(d);
  });
  sync();
  var first=ins.find(function(i){return !i.value})||ins[0]; if(first) first.focus();
}

/* ---------- timer / sound / wake ---------- */
var actx=null, beepAudio=null, audioReady=false, unlocking=false;
// короткий двойной сигнал в виде WAV: HTML-аудио на iPhone играет и при включённом беззвучном режиме, в отличие от WebAudio
// silent=true — тот же файл из нулей: им «будим» звук, чтобы при касании ничего не звучало
function wavUrl(silent){
  var sr=22050, n=Math.round(sr*0.6), buf=new ArrayBuffer(44+n*2), v=new DataView(buf), i;
  var ws=function(o,t){for(var k=0;k<t.length;k++)v.setUint8(o+k,t.charCodeAt(k))};
  ws(0,'RIFF');v.setUint32(4,36+n*2,true);ws(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);ws(36,'data');v.setUint32(40,n*2,true);
  for(i=0;i<n;i++){
    var t=i/sr, tt=t<0.2?t:(t>=0.3&&t<0.5?t-0.3:-1), a=0;
    if(tt>=0&&!silent) a=Math.sin(2*Math.PI*880*t)*0.7*Math.min(1,tt/0.01,(0.2-tt)/0.01);
    v.setInt16(44+i*2,Math.round(a*32767),true);
  }
  return URL.createObjectURL(new Blob([buf],{type:'audio/wav'}));
}
// вызывается при любом касании: «будит» звук, чтобы сигнал сработал позже без участия пользователя
function unlockAudio(){
  try{
    var C=window.AudioContext||window.webkitAudioContext;
    if(C){actx=actx||new C(); if(actx.state!=='running') actx.resume();}
  }catch(e){}
  try{
    if(!beepAudio){beepAudio=new Audio(wavUrl(true)); beepAudio.preload='auto';}
    if(!audioReady&&!unlocking){
      unlocking=true;
      var pr=beepAudio.play();
      // после «пробуждения» тишиной подставляем настоящий сигнал
      var ready=function(){beepAudio.pause();beepAudio.src=wavUrl(false);audioReady=true;unlocking=false;};
      if(pr&&pr.then) pr.then(ready).catch(function(){unlocking=false;}); else ready();
    }
  }catch(e){}
}
function webBeep(){
  try{
    if(!actx) return;
    if(actx.state!=='running') actx.resume();
    [0,0.3].forEach(function(dt){
      var o=actx.createOscillator(), g=actx.createGain();
      o.connect(g); g.connect(actx.destination);
      o.frequency.value=880; g.gain.value=0.25;
      o.start(actx.currentTime+dt); o.stop(actx.currentTime+dt+0.2);
    });
  }catch(e){}
}
function beep(){
  try{
    if(beepAudio&&audioReady){
      beepAudio.currentTime=0;
      var pr=beepAudio.play();
      if(pr&&pr.catch) pr.catch(function(){});
    }
  }catch(e){}
  webBeep();
  try{if(navigator.vibrate) navigator.vibrate([200,100,200]);}catch(e){}
}

// состояние таймера хранится в самой тренировке (s.rt), поэтому переживает перезагрузку:
// from — когда начался отдых, end — когда он закончится, start — когда нажали «Начать подход»
function startRest(s){
  var now=Date.now();
  s.rt={from:now,end:now+S.settings.rest*1000,start:null,beeped:false};
}
// сигнал только если отдых шёл на экране и закончился на глазах (без перерыва в работе приложения);
// при открытии приложения, входе в тренировку или возврате из фона — тишина
var lastTick=0, seenEnd=0;
function tick(){
  var now=Date.now(), live=lastTick>0&&now-lastTick<2000&&!document.hidden;
  lastTick=now;
  var bar=document.getElementById('restbar');
  if(!bar) return;
  var s=curSes(), rt=(s&&!s.done&&s.rt)||{}, tr=!!S.settings.track;
  var swe=document.getElementById('swtime');
  if(swe&&s&&s.sw) swe.textContent=mmss(Math.max(0,Math.floor((now-s.sw.start)/1000)));
  var show=false, line=false, btn=false, big=false, done=false, text='';
  if(s&&!s.done&&!rt.start){
    if(rt.from){
      show=true; line=true;
      var left=rt.end-now;
      if(left>0){ text='Отдых '+mmss(Math.ceil(left/1000)); seenEnd=rt.end; }
      else {
        done=true; text='Отдых окончен';
        if(!rt.beeped){rt.beeped=true; if(live&&seenEnd===rt.end&&now-rt.end<8000) beep();}
      }
      btn=tr; big=tr&&done;
    } else if(tr&&!s.last){
      show=true; btn=true; big=true;   // самый первый подход тренировки
    }
  }
  bar.classList.toggle('hide',!show);
  bar.classList.toggle('done',done);
  bar.classList.toggle('bigbtn',big);
  document.getElementById('rline').classList.toggle('hide',!line);
  document.getElementById('sbtn').classList.toggle('hide',!btn);
  if(line){
    document.getElementById('rtime').textContent=text;
    var rs=document.getElementById('rstop'), want=tr?'skip':'x';
    if(rs.dataset.ic!==want){rs.dataset.ic=want; rs.innerHTML=ic(want);}
  }
}

/* ---------- session logic ---------- */
function openSession(id){
  var ses=S.sessions.find(function(s){return s.id===id});
  if(!ses) return;
  var p=progById(ses.programId);
  var wk=p?p.workouts.find(function(w){return w.id===ses.workoutId}):null;
  var exs=wk?wk.exercises:[];
  var first=exs.find(function(e){return !(ses.entries[e.id]&&ses.entries[e.id].sets.length)})||exs[0];
  openEx=(first&&!ses.done)?first.id:null;
  if(openEx) initDraft(ses,openEx);
  nav.push({t:'session',id:id});
  render(); toTop();
}
function finishSession(s){
  var n=Object.keys(s.entries).reduce(function(a,k){return a+s.entries[k].sets.length},0);
  if(!n) S.sessions=S.sessions.filter(function(x){return x.id!==s.id});
  else {s.done=true; s.t1=Date.now();}
  delete s.rt; delete s.sw;
  save();
}
// завершить тренировку и показать окно итогов; true — тренировка сохранена (пустая удаляется)
function doFinish(s){
  var id=s.id;
  finishSession(s);
  if(S.sessions.some(function(x){return x.id===id})){modal={sid:id};return true;}
  return false;
}
function exportData(){
  var text=JSON.stringify(S,null,1), name='gym-backup-'+today()+'.json';
  var file=new File([text],name,{type:'application/json'});
  var fallback=function(){
    var a=document.createElement('a');
    a.href=URL.createObjectURL(file); a.download=name;
    document.body.appendChild(a); a.click(); a.remove();
  };
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      navigator.share({files:[file],title:name}).then(markBackup).catch(function(e){if(e&&e.name!=='AbortError'){fallback();markBackup();}});
      return;
    }
  }catch(e){}
  fallback(); markBackup();
}
